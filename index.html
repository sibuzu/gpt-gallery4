<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Gallery 4 遊戲與動漫角色圖庫，瀏覽角色影像與專屬創作提示詞。">
  <title>Gallery 4</title>
  <link rel="icon" href="favicon.ico?v=6af9208b212a" type="image/x-icon">
  <link rel="icon" href="favicon.svg?v=811685325d47" type="image/svg+xml">
  <link rel="stylesheet" href="styles/gallery.css?v=2efbf08d2672">
</head>
<body>
  <header>
    <div class="bar">
      <div>
        <div class="title-line">
          <h1>Gallery 4</h1>
          <button class="title-toggle icon-button" id="expandAllToggle" type="button" aria-label="全部縮回" title="全部縮回">
            <img src="collapse-svgrepo-com.svg" alt="">
          </button>
          <p class="meta"><span id="visibleCount">0</span>/<span id="totalCount">0</span> images</p>
        </div>
      </div>
      <select class="category-menu" id="categoryMenu" aria-label="作品分類"></select>
      <input class="search" id="search" type="search" placeholder="搜尋角色或作品">
    </div>
    <nav class="filters" id="filters" aria-label="作品分類"></nav>
  </header>

  <main>
    <section class="grid" id="grid" aria-live="polite"></section>
    <p class="empty" id="empty">沒有符合條件的圖片</p>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
    <button class="close" id="close" type="button" aria-label="關閉">×</button>
    <figure>
      <img id="preview" alt="">
      <figcaption id="previewCaption"></figcaption>
    </figure>
  </div>
  <script src="scripts/gallery-data.js?v=03bb657c548d" defer></script>
  <script src="scripts/gallery.js?v=dcf4983c522f" defer></script>
</body>
</html>
